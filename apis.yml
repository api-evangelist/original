name: Bodygram
description: >-
  Bodygram is an AI-powered body measurement company whose technology extracts 35+
  body measurements, body composition, posture data, and a 3D avatar from a smartphone
  photo or a person's basic stats. The Bodygram Platform API and the Body2Fit and
  Headless JavaScript SDKs let retail, fashion, uniform, health, and wellness
  businesses embed accurate sizing and body scanning into their own apps and websites
  to increase conversion and reduce returns. Surfaced as a 500 Global portfolio company
  and enriched from Bodygram's public developer surface (docs.bodygram.com).
